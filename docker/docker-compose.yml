services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - 127.0.0.1:6333:6333
      - 127.0.0.1:6334:6334
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - qdrant-net

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    ipc: host
    environment: 
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_DEBUG_LOG_API_SERVER_RESPONSE=TRUE

    command: --model openai/gpt-oss-20b --max-model-len 50000 --gpu-memory-utilization 0.7
      # command: --model leon-se/gemma-3-27b-it-qat-W4A16-G128 --max-model-len 4096 --max-num-seqs 1 --gpu-memory-utilization 0.75
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - /root/.cache/vllm:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    networks:
      - qdrant-net

  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: memgraph
    restart: unless-stopped
    ports:
      - "127.0.0.1:7688:7687"
      - "127.0.0.1:7444:7444"
    environment:
      - MEMGRAPH_USER=${MEMGRAPH_USER}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD}
      - MEMGRAPH_LOG_LEVEL=TRACE
    volumes:
      - mg_lib:/var/lib/memgraph
      - mg_log:/var/log/memgraph

  memgraph-lab:
    image: memgraph/lab:latest
    container_name: memgraph-lab
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      - memgraph


volumes:
  qdrant_data:
  mg_lib:
  mg_log:

networks:
  qdrant-net:

configs:
  qdrant_config:
    content: |
      log_level: INFO
